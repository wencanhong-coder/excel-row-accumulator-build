name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --collect-all openpyxl --name 瓶类重量占比汇总 瓶类重量占比汇总.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: 瓶类重量占比汇总-Windows
          path: dist/瓶类重量占比汇总.exe
          if-no-files-found: error
          retention-days: 1
