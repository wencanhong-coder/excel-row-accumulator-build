name: Build and publish Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --collect-all openpyxl --name 瓶类重量占比汇总 瓶类重量占比汇总.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 瓶类重量占比汇总 v1.0.0
          body: Windows 双击运行版本。将 EXE 与待处理 Excel 放在同一文件夹后双击运行。
          files: dist/瓶类重量占比汇总.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: 瓶类重量占比汇总-Windows
          path: dist/瓶类重量占比汇总.exe
          if-no-files-found: error
          retention-days: 30
